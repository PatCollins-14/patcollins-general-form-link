<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your Next Step</title>
<meta name="description" content="Answer a few quick questions to find your next mortgage step.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b1728;
    --ink-soft: #566175;
    --ink-mute: #727c8c;
    --amber: #eba31a;
    --amber-deep: #c47600;
    --amber-tint: #fff0cb;
    --amber-wash: #fffaf0;
    --line: #d9dee6;
    --field-line: #d3dae4;
    --paper: #f7f5ef;
    --card: #ffffff;
    --danger: #b8322c;
    --ok: #2f8b57;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: var(--paper);
    color: var(--ink);
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  input, select { font: inherit; }
  a { color: inherit; }

  .grain {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .88;
    background:
      radial-gradient(circle at 7% 18%, #35a9df1a, #0000 25%),
      radial-gradient(circle at 93% 73%, #eba31a1f, #0000 30%),
      repeating-linear-gradient(123deg, #0b172804 0 1px, #0000 1px 5px);
  }

  .stage {
    position: relative; z-index: 1;
    min-height: 100vh; min-height: 100svh;
    display: flex; align-items: center; justify-content: center;
    padding: 28px 20px 40px;
  }
  .stage-inner { width: 100%; display: flex; justify-content: center; }

  h1.title {
    margin: 0;
    font-family: "Space Grotesk", "DM Sans", system-ui, sans-serif;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.05em;
    font-size: clamp(1.75rem, 4.4vw, 2.65rem);
    text-wrap: balance;
    outline: none;
  }
  .eyebrow {
    margin: 0 0 8px;
    font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
    color: var(--amber-deep);
  }
  .eyebrow .dot { padding: 0 6px; color: #9ba2ad; }
  .supporting {
    margin: 10px auto 0; max-width: 32rem;
    font-size: .875rem; line-height: 1.25rem; color: #687386; text-wrap: balance;
  }
  .center { text-align: center; }

  /* Intro card */
  .intro {
    width: 100%; max-width: 610px;
    background: var(--card); border-radius: 24px;
    padding: 28px 32px; text-align: center;
    box-shadow: 0 18px 60px rgba(11, 23, 40, .09);
  }
  .intro .eyebrow { letter-spacing: .18em; }
  .choice-list { display: grid; gap: 8px; max-width: 510px; margin: 20px auto 0; text-align: left; }
  .apply-link {
    display: inline-block; margin-top: 16px;
    font-size: .875rem; font-weight: 700; color: #46536a;
    text-decoration: underline; text-decoration-color: var(--amber); text-decoration-thickness: 2px; text-underline-offset: 4px;
  }
  .apply-link:hover { color: var(--ink); }

  /* Cards */
  .choice-card, .answer-card {
    display: flex; align-items: center; gap: 12px; width: 100%;
    min-height: 62px; padding: 12px 15px;
    background: #fff; color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 15px;
    box-shadow: 0 2px #0b172805;
    text-align: left;
    transition: transform .16s cubic-bezier(.23,1,.32,1), border-color .16s cubic-bezier(.23,1,.32,1), box-shadow .16s cubic-bezier(.23,1,.32,1), background-color .16s;
  }
  .choice-card:hover, .answer-card:hover {
    border-color: var(--amber); transform: translateY(-2px); box-shadow: 0 9px 24px #0b172817;
  }
  .choice-card:active, .answer-card:active { transform: translateY(0) scale(.99); }
  .answer-card.selected { background: var(--amber-wash); border-color: var(--amber); box-shadow: 0 0 0 2px #eba31a26; }
  .icon-chip {
    flex: none; display: grid; place-items: center;
    width: 36px; height: 36px; border-radius: 12px;
    background: var(--amber-tint); color: #a26000;
  }
  .card-label { flex: 1; min-width: 0; }
  .card-label b { display: block; font-size: 1rem; font-weight: 800; letter-spacing: -.02em; }
  .choice-card .card-label { font-size: 1rem; font-weight: 800; letter-spacing: -.025em; }
  .card-label small { display: block; margin-top: 2px; font-size: .8125rem; font-weight: 500; color: #687386; }
  .chev { flex: none; color: #89919d; transition: transform .2s; }
  .choice-card:hover .chev { transform: translateX(4px); }
  .tick {
    flex: none; display: grid; place-items: center;
    width: 24px; height: 24px; border: 1.5px solid #cad1db; border-radius: 50%; color: var(--ink);
  }
  .tick.square { border-radius: 7px; }
  .answer-card.selected .tick { background: var(--amber); border-color: var(--amber); }
  .tick svg { opacity: 0; }
  .answer-card.selected .tick svg { opacity: 1; }
  .answers { display: grid; gap: 8px; }

  /* Question shell */
  .shell { width: 100%; max-width: 660px; }
  .shell.slide-fwd { animation: slideR .32s cubic-bezier(.23,1,.32,1); }
  .shell.slide-back { animation: slideL .32s cubic-bezier(.23,1,.32,1); }
  @keyframes slideR { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
  @keyframes slideL { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
  .progress { height: 4px; border-radius: 99px; background: #0b17280f; overflow: hidden; margin-bottom: 14px; }
  .progress span { display: block; height: 100%; background: var(--amber); border-radius: inherit; transition: width .35s cubic-bezier(.23,1,.32,1); }
  .back {
    display: inline-flex; align-items: center; gap: 7px;
    margin-bottom: 14px; padding: 6px 10px 6px 7px; border-radius: 999px;
    font-size: .78rem; font-weight: 800; color: var(--ink-soft);
  }
  .back:hover { color: var(--ink); background: var(--amber-tint); }
  .head { margin-bottom: 20px; text-align: center; }
  .step { max-width: 560px; margin: 0 auto; }

  .info-link {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    padding: 5px 9px; border-radius: 999px;
    font-size: .8rem; font-weight: 800; color: var(--ink-soft);
    text-decoration: underline; text-decoration-color: var(--amber); text-decoration-thickness: 2px; text-underline-offset: 4px;
  }
  .info-link:hover { color: var(--ink); background: var(--amber-tint); }
  .info-panel {
    margin: 10px auto 0; max-width: 32rem; padding: 12px 14px;
    background: var(--amber-wash); border: 1px solid #f3dca5; border-radius: 12px;
    font-size: .8125rem; line-height: 1.25rem; color: #4f5d70; text-align: left;
  }

  /* Fields */
  .field-label { display: grid; gap: 5px; text-align: left; font-size: .72rem; font-weight: 800; color: #354258; }
  .field-input, select.field-input {
    width: 100%; min-width: 0; padding: 12px 13px;
    background: #fff; color: var(--ink);
    border: 1.5px solid var(--field-line); border-radius: 12px;
    font-size: 1rem; font-weight: 700;
    box-shadow: 0 4px 14px #0b172809;
    transition: border-color .16s ease-out, box-shadow .16s ease-out;
  }
  .field-input:focus { border-color: var(--amber); outline: none; box-shadow: 0 0 0 4px #eba31a21; }
  .field-input.invalid { border-color: #c8483f; }
  .field-input::placeholder { color: #a6aeba; font-weight: 600; }
  .field-error { color: var(--danger); font-size: .72rem; font-weight: 700; min-height: 0; }
  .grid-2 { display: grid; gap: 12px; grid-template-columns: 1fr; }
  .span-2 { grid-column: 1 / -1; }
  @media (min-width: 640px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
  .money-wrap { position: relative; }
  .money-wrap .prefix {
    position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
    font-size: 1.25rem; font-weight: 700; color: var(--ink-soft); pointer-events: none;
  }
  .money-input {
    width: 100%; padding: 15px 19px 15px 3.25rem;
    background: #fff; color: var(--ink);
    border: 1.5px solid var(--field-line); border-radius: 15px;
    font-size: clamp(1.2rem, 2.7vw, 1.6rem); font-weight: 800; letter-spacing: -.035em;
    box-shadow: 0 5px 15px #0b17280a;
    transition: border-color .16s ease-out, box-shadow .16s ease-out;
  }
  .money-input::placeholder { color: #a6aeba; }
  .money-input:focus { border-color: var(--amber); outline: none; box-shadow: 0 0 0 4px #eba31a21; }
  .label-above { margin-bottom: 4px; }

  /* Buttons */
  .continue {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 54px; padding: 14px 20px;
    background: var(--amber); color: var(--ink);
    border-radius: 15px;
    font-size: 1rem; font-weight: 800; letter-spacing: -.02em;
    box-shadow: 0 10px 24px rgba(235, 163, 26, .28);
    transition: transform .16s cubic-bezier(.23,1,.32,1), background-color .16s, box-shadow .16s, opacity .16s;
  }
  .continue:hover:not(:disabled) { background: #f2b030; transform: translateY(-1px); }
  .continue:active:not(:disabled) { transform: scale(.98); }
  .continue:disabled { opacity: .45; box-shadow: none; }
  .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; }
  .note {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin: 12px 0 0; text-align: center;
    font-size: .75rem; font-weight: 600; line-height: 1.25rem; color: var(--ink-mute);
  }
  .note svg { flex: none; color: var(--amber-deep); }
  .form-error { margin: 12px 0 0; text-align: center; font-size: .8rem; font-weight: 700; color: var(--danger); }
  .text-link {
    font-size: .875rem; font-weight: 700; color: var(--ink-soft);
    text-decoration: underline; text-decoration-color: var(--amber); text-decoration-thickness: 2px; text-underline-offset: 4px;
  }
  .text-link:hover { color: var(--ink); }

  /* Done */
  .done { width: 100%; max-width: 720px; text-align: center; animation: slideR .4s cubic-bezier(.23,1,.32,1); }
  .done-badge {
    position: relative; display: grid; place-items: center;
    width: 62px; height: 62px; margin: 0 auto 16px;
    border-radius: 22px; background: var(--amber-tint); color: var(--amber-deep);
    box-shadow: 0 18px 40px rgba(235, 163, 26, .14);
  }
  .done-badge .pip {
    position: absolute; right: -4px; top: -4px; display: grid; place-items: center;
    width: 24px; height: 24px; border-radius: 50%; background: var(--amber); color: var(--ink);
  }
  .done .eyebrow { font-size: 12px; letter-spacing: .16em; }
  .done h1 { max-width: 650px; margin: 0 auto; }
  .done p.copy { margin: 12px auto 0; max-width: 570px; font-size: .875rem; line-height: 1.5rem; color: #626e81; text-wrap: balance; }
  .booking {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 18px; padding: 15px 26px; border-radius: 16px;
    background: var(--ink); color: #fff; text-decoration: none;
    font-size: 1rem; font-weight: 800; letter-spacing: -.02em;
    box-shadow: 0 14px 30px rgba(11, 23, 40, .22);
    transition: transform .16s cubic-bezier(.23,1,.32,1), box-shadow .16s;
  }
  .booking:hover { transform: translateY(-2px); box-shadow: 0 18px 36px rgba(11, 23, 40, .26); }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #eba31a73; outline-offset: 3px; }

  @media (max-width: 520px) {
    .stage { align-items: flex-start; padding-top: 24px; }
    .intro { padding: 22px 16px; border-radius: 20px; }
    .choice-card, .answer-card { gap: 10px; padding: 12px 11px; }
    .icon-chip { width: 34px; height: 34px; border-radius: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main class="stage">
  <div class="stage-inner" id="app"></div>
</main>

<script>
/* ==========================================================================
   CONFIG — edit these before publishing
   ========================================================================== */
const CONFIG = {
  // Where completed leads are POSTed as JSON (e.g. a GoHighLevel inbound webhook,
  // Zapier catch-hook, Make webhook, or your own endpoint).
  // Leave empty to run in demo mode (payload is logged to the browser console).
  SUBMIT_URL: "",

  // Button on the final screen ("Schedule a conversation").
  BOOKING_URL: "https://prod.lendingpad.com/emci/38d77370-2060-489a-a024-4bdc8db0a865/pos#/",

  // Link under the first question ("Ready to apply?"). Set to "" to hide it.
  APPLY_URL: "https://prod.lendingpad.com/emci/38d77370-2060-489a-a024-4bdc8db0a865/pos#/",

  ADVISOR: "Pat",

  // Shown under the phone field. Have your compliance team confirm the wording.
  CONSENT_TEXT: "By continuing, you agree to be contacted by phone, text, or email about your mortgage inquiry. Message and data rates may apply.",

  // Optional: called after a successful submit (e.g. to fire a pixel/conversion event).
  onSubmitted: function (payload) { /* e.g. fbq('track', 'Lead'); gtag('event', 'generate_lead'); */ }
};

/* ==========================================================================
   QUESTION FLOWS
   kinds: choice | multi | text | money | address | contact | phone
   ========================================================================== */
const USAGE = ["Primary residence", "Second home", "Rental property", "Investment property"];
const opts = (list, icon) => list.map(l => ({ label: l, value: l, icon: icon || "home" }));
const mk = (pairs) => pairs.map(p => ({ label: p[0], value: p[0], icon: p[1], detail: p[2] }));

const CASH_USE = [
  { label: "Pay off debt", value: "Pay off debt", icon: "cash", detail: "Credit cards, personal loans, student loans" },
  { label: "Pay for a one-time expense", value: "Pay for a one-time expense", icon: "home", detail: "Home improvements, medical bills, large purchases" },
  { label: "Pay for a recurring expense", value: "Pay for a recurring expense", icon: "calendar", detail: "Monthly payments, tuition, ongoing obligations" },
  { label: "Pay for something else", value: "Pay for something else", icon: "spark", detail: "Emergency cash reserve, investing, other" }
];

const PHONE_Q = (supporting) => ({
  id: "phone", kind: "phone", eyebrow: "Phone number", title: "Enter your phone number.",
  supporting: supporting || "We’ll use this to reach you about scheduling your appointment.", buttonLabel: "Continue"
});

const FLOWS = {
  purchase: {
    label: "Buy a home", icon: "home",
    questions: [
      { id: "purchaseJourney", kind: "choice", eyebrow: "Home buying process", title: "Where are you in the home buying process?",
        options: mk([["Signed a purchase agreement", "home"], ["Making offers", "landmark"], ["Going to open houses", "location"], ["Just researching", "spark"]]) },
      { id: "purchaseTimeline", kind: "choice", eyebrow: "Purchase timing", title: "When do you plan to buy?",
        options: opts(["0–3 months", "3–6 months", "6+ months", "Not sure"], "calendar") },
      { id: "purchaseUsage", kind: "choice", eyebrow: "Property use", title: "How will you use this home?",
        options: mk([["Primary residence", "home"], ["Second home", "building"], ["Rental property", "building"], ["Investment property", "cash"]]) },
      { id: "purchasePropertyType", kind: "choice", eyebrow: "Property type", title: "What type of home?",
        options: mk([["Single Family", "home"], ["Condo", "building"], ["Co-op", "building"], ["2 to 4 units", "building"], ["Manufactured home", "home"]]) },
      { id: "purchaseUnits", kind: "choice", eyebrow: "Property type", title: "How many units will the property have?",
        when: a => a.purchasePropertyType === "2 to 4 units",
        options: opts(["2 units", "3 units", "4 units"], "building") },
      { id: "purchaseOwnership", kind: "choice", eyebrow: "Buyer history", title: "Have you owned any property in the last three years?",
        infoLabel: "What is a first-time home buyer?",
        info: "Lenders generally treat you as a first-time home buyer if you haven’t owned a home in the last three years. Some programs use their own definition, so we’ll confirm what applies to you.",
        options: [{ label: "Yes", value: "Yes", icon: "home" }, { label: "No", value: "No", icon: "users" }] },
      { id: "purchaseArea", kind: "text", eyebrow: "Purchase area", title: "Where are you looking to buy?",
        inputLabel: "City, State, or ZIP code", placeholder: "City, State, or ZIP code", buttonLabel: "Next",
        note: "Enter the city, state, or ZIP code where you plan to buy." },
      { id: "contact", kind: "contact", eyebrow: "Your information", title: "Let’s start personalizing your offer!", buttonLabel: "Continue" },
      PHONE_Q()
    ]
  },

  refinance: {
    label: "Refinance a mortgage", icon: "landmark",
    questions: [
      { id: "refinanceGoals", kind: "multi", eyebrow: "Refinance goals", title: "What are your refinance goals?",
        supporting: "Choose the goal that best matches what you want to do.",
        options: mk([["Lower my monthly payment", "cash"], ["Long-term savings", "calendar"], ["Take cash out", "landmark"], ["Just checking rates", "spark"]]) },
      { id: "refinanceCashUse", kind: "multi", eyebrow: "Cash use", title: "How will you use this cash?",
        supporting: "This helps us recommend the best loan options for you.",
        when: a => (a.refinanceGoals || []).includes("Take cash out"), options: CASH_USE },
      { id: "refinanceAddress", kind: "address", eyebrow: "Your property", title: "What home are you refinancing?",
        infoLabel: "Why do we need this?",
        info: "The property address lets us confirm details like location and loan limits, so the options we discuss actually fit your home." },
      { id: "refinanceUsage", kind: "choice", eyebrow: "Property use", title: "How do you use this property?",
        options: mk([["Primary residence", "home"], ["Second home", "building"], ["Rental property", "building"], ["Investment property", "cash"]]) },
      { id: "refinancePropertyType", kind: "choice", eyebrow: "Property type", title: "What type of property is it?",
        options: mk([["Single Family", "home"], ["Condo", "building"], ["2 to 4 units", "building"], ["Manufactured home", "home"]]) },
      { id: "refinanceHomeValue", kind: "money", eyebrow: "Home value", title: "What’s your estimated home value?",
        inputLabel: "Estimated home value", placeholder: "500,000" },
      { id: "contact", kind: "contact", eyebrow: "Your information", title: "Let’s start personalizing your offer!", buttonLabel: "Continue" },
      PHONE_Q()
    ]
  },

  equity: {
    label: "Use my home equity", icon: "cash",
    questions: [
      { id: "equityCashUse", kind: "multi", eyebrow: "Cash use", title: "How will you use this cash?",
        supporting: "This helps us recommend the best loan options for you.", options: CASH_USE },
      { id: "equityAddress", kind: "address", eyebrow: "Your property", title: "What’s the address of the property you’d like to borrow from?",
        infoLabel: "Why do we need this?",
        info: "The property address lets us confirm details like location and loan limits, so the options we discuss actually fit your home." },
      { id: "equityUsage", kind: "choice", eyebrow: "Property use", title: "How do you use this property?",
        options: mk([["Primary residence", "home"], ["Second home", "building"], ["Rental property", "building"], ["Investment property", "cash"]]) },
      { id: "equityPropertyType", kind: "choice", eyebrow: "Property type", title: "What type of property is it?",
        infoLabel: "I don’t know my property type",
        info: "No problem. Pick the closest match, and we’ll confirm the details with you later.",
        options: mk([["Single family or Townhome", "home"], ["Condo", "building"], ["2 to 4 units", "building"]]) },
      { id: "equityHomeValue", kind: "money", eyebrow: "Home value", title: "What is your home’s estimated value?",
        supporting: "This is just an estimate, we’ll verify later.",
        inputLabel: "Estimated home value", placeholder: "500,000" },
      { id: "contact", kind: "contact", eyebrow: "Your information", title: "We need a bit more info to find your custom rates", buttonLabel: "Continue" },
      PHONE_Q()
    ]
  },

  reverse: {
    label: "Reverse Mortgage", icon: "users",
    questions: [
      { id: "reverseAge", kind: "choice", eyebrow: "Borrower age", title: "How old is the youngest homeowner?",
        supporting: "Reverse mortgage eligibility and available proceeds are based in part on the youngest homeowner’s age.",
        options: opts(["Under 62", "62–69", "70–79", "80 or older"], "users") },
      { id: "reverseGoal", kind: "choice", eyebrow: "Your goal", title: "What would you like a reverse mortgage to help you do?",
        options: mk([["Supplement retirement income", "cash"], ["Pay off my existing mortgage", "landmark"], ["Create a cash reserve", "cash"], ["Pay for home improvements or care", "home"], ["I’m still exploring my options", "spark"]]) },
      { id: "reverseAddress", kind: "address", eyebrow: "Your property", title: "What is the address of the home you’d like to use?",
        supporting: "We’ll use the property details to identify the reverse mortgage options that may fit." },
      { id: "reversePropertyType", kind: "choice", eyebrow: "Property type", title: "What type of property is it?",
        options: mk([["Single family home", "home"], ["Townhome", "home"], ["Condominium", "building"], ["2 to 4 unit property", "building"], ["Manufactured home", "home"]]) },
      { id: "reverseHomeValue", kind: "money", eyebrow: "Home value", title: "What is the home’s estimated value?",
        supporting: "An estimate is enough for now; the value will be verified later.",
        inputLabel: "Estimated home value", placeholder: "650,000" },
      { id: "reverseMortgageBalance", kind: "money", eyebrow: "Current mortgage", title: "About how much do you still owe on the home?",
        supporting: "A reverse mortgage may first be used to pay off an existing mortgage balance.",
        inputLabel: "Estimated mortgage balance", placeholder: "150,000" },
      { id: "reverseMarried", kind: "choice", eyebrow: "Household", title: "Are you married?",
        supporting: "This helps us understand whether a spouse may need to be included in the conversation.",
        options: [{ label: "Yes", value: "Yes", icon: "users" }, { label: "No", value: "No", icon: "users" }] },
      { id: "reverseSpouseAge", kind: "text", eyebrow: "Spouse information", title: "What is your spouse’s age?",
        supporting: "Please enter the age of your spouse so we can prepare for a more accurate conversation.",
        inputLabel: "Spouse age", placeholder: "Age", numeric: true, maxLength: 3,
        when: a => a.reverseMarried === "Yes" },
      { id: "contact", kind: "contact", eyebrow: "Your information", title: "Let’s find the right reverse mortgage conversation for you.",
        supporting: "We’ll use your information to prepare for a no-pressure discussion of your options.", buttonLabel: "Continue" },
      PHONE_Q("We’ll use this to reach you about scheduling your reverse mortgage appointment.")
    ]
  }
};

const STATES = "AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split(" ");

/* ==========================================================================

/* ==========================================================================

const app = document.getElementById("app");
const state = { flow: null, idx: 0, answers: {}, dir: "fwd", errors: {}, submitting: false, submitError: "", showInfo: false, showUnit: false };

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const emailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v || "");
const digits = v => String(v || "").replace(/\D/g, "");
const fmtMoney = v => { const d = digits(v); return d ? Number(d).toLocaleString("en-US") : ""; };
function fmtPhone(v) {
  let d = digits(v);
  if (d.length === 11 && d[0] === "1") d = d.slice(1);
  d = d.slice(0, 10);
  if (d.length < 4) return d;
  if (d.length < 7) return "(" + d.slice(0, 3) + ") " + d.slice(3);
  return "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6);
}
const questions = () => state.flow ? FLOWS[state.flow].questions.filter(q => !q.when || q.when(state.answers)) : [];
const $ = (sel, root) => (root || app).querySelector(sel);
const $$ = (sel, root) => Array.from((root || app).querySelectorAll(sel));

function go(dir) {
  state.dir = dir === "back" ? "back" : "fwd";
  state.idx = Math.max(0, state.idx + (dir === "back" ? -1 : 1));
  state.errors = {}; state.submitError = ""; state.showInfo = false; state.showUnit = false;
  render();
}
function startFlow(key) {
  state.flow = key; state.idx = 0; state.answers = {}; state.dir = "fwd";
  state.errors = {}; state.submitError = ""; state.showInfo = false; state.showUnit = false;
  render();
}
function reset() { state.flow = null; state.idx = 0; state.answers = {}; render(); }
function back() {
  if (state.idx === 0) { state.flow = null; render(); } else go("back");
}

/* ==========================================================================
   RENDER
   ========================================================================== */
function render() {
  if (!state.flow) return renderIntro();
  const qs = questions();
  if (state.idx >= qs.length) return renderDone();
  renderQuestion(qs[state.idx], qs.length);
  window.scrollTo({ top: 0 });
}

function renderIntro() {
  const cards = Object.keys(FLOWS).map(k =>
    '<button class="choice-card" data-flow="' + k + '">' +
      '<span class="icon-chip">' + icon(FLOWS[k].icon) + '</span>' +
      '<span class="card-label">' + esc(FLOWS[k].label) + '</span>' +
      '<span class="chev">' + icon("right") + '</span>' +
    '</button>').join("");
  app.innerHTML =
    '<section class="intro">' +
      '<p class="eyebrow">Clarity before commitment</p>' +
      '<h1 class="title" tabindex="-1">What can I help you with?</h1>' +
      '<div class="choice-list">' + cards + '</div>' +
      (CONFIG.APPLY_URL ? '<a class="apply-link" href="' + esc(CONFIG.APPLY_URL) + '" target="_blank" rel="noopener noreferrer">Ready to apply? Begin your application</a>' : '') +
    '</section>';
  $$("[data-flow]").forEach(b => b.addEventListener("click", () => startFlow(b.dataset.flow)));
}

function renderQuestion(q, total) {
  const pct = Math.round(((state.idx) / total) * 100);
  let body = "";
  switch (q.kind) {
    case "choice": body = bodyChoice(q); break;
    case "multi": body = bodyMulti(q); break;
    case "text": body = bodyText(q); break;
    case "money": body = bodyMoney(q); break;
    case "address": body = bodyAddress(q); break;
    case "contact": body = bodyContact(q); break;
    case "phone": body = bodyPhone(q); break;
  }
  app.innerHTML =
    '<div class="shell ' + (state.dir === "back" ? "slide-back" : "slide-fwd") + '">' +
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><span style="width:' + pct + '%"></span></div>' +
      '<button class="back" id="back">' + icon("back", 16, 2.2) + ' Back</button>' +
      '<div class="head">' +
        '<p class="eyebrow">' + esc(q.eyebrow) + '<span class="dot">·</span>' + (state.idx + 1) + ' of ' + total + '</p>' +
        '<h1 class="title" tabindex="-1">' + esc(q.title) + '</h1>' +
        (q.supporting ? '<p class="supporting">' + esc(q.supporting) + '</p>' : '') +
        (q.info ? '<button class="info-link" id="info-toggle" aria-expanded="' + state.showInfo + '">' + esc(q.infoLabel) + '</button>' +
                  (state.showInfo ? '<div class="info-panel" role="note">' + esc(q.info) + '</div>' : '') : '') +
      '</div>' +
      body +
    '</div>';

  $("#back").addEventListener("click", back);
  const it = $("#info-toggle");
  if (it) it.addEventListener("click", () => { state.showInfo = !state.showInfo; renderKeepingInputs(q, total); });

  bind[q.kind](q);

  const auto = $("[autofocus]");
  if (auto) auto.focus({ preventScroll: true }); else { const h = $("h1.title"); if (h) h.focus({ preventScroll: true }); }
}

// Re-render the same step (e.g. toggling the info panel) without losing typed values.
function renderKeepingInputs(q, total) { renderQuestion(q, total); }

function bodyChoice(q) {

    const sel = state.answers[q.id] === o.value;

      '<span class="icon-chip">' + icon(o.icon) + '</span>' +

  }).join("") + '</div>';

  return '<div class="step"><div class="answers" role="group" aria-label="' + esc(q.title) + '">' + q.options.map(o => {

  '<button class="continue mt-4" id="go"' + (cur.length ? "" : " disabled") + '>Continue ' + icon("arrow") + '</button></div>';
}
function bodyText(q) {

    '<p class="note">' + icon("shield", 16) + '<span>Your answers stay private and are only used to guide the conversation.</span></p></div>';
}

    (state.showUnit ? '<label class="field-label span-2">Apt / Unit<input class="field-input" id="a-unit" autocomplete="address-line2" value="' + esc(a[k + "Unit"] || "") + '"></label>' : '') +

/* ==========================================================================
   EVENT BINDING PER KIND
   ========================================================================== */
const bind = {
  choice(q) {
    $$(".answer-card").forEach(btn => btn.addEventListener("click", () => {
      state.answers[q.id] = btn.dataset.value;
      $$(".answer-card").forEach(b => { const on = b === btn; b.classList.toggle("selected", on); b.setAttribute("aria-checked", on); });
      setTimeout(() => go("fwd"), 180);
    }));
  },
  multi(q) {
    const go_ = $("#go");
    $$(".answer-card").forEach(btn => btn.addEventListener("click", () => {
      const cur = state.answers[q.id] || [];
      const v = btn.dataset.value;
      const next = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat(v);
      state.answers[q.id] = next;
      btn.classList.toggle("selected", next.includes(v));
      btn.setAttribute("aria-checked", next.includes(v));
      go_.disabled = next.length === 0;
    }));
    go_.addEventListener("click", () => { if ((state.answers[q.id] || []).length) go("fwd"); });
  },
  text(q) {
    const inp = $("#f-" + q.id), btn = $("#go");
    inp.addEventListener("input", () => {
      if (q.numeric) inp.value = inp.value.replace(/\D/g, "");
      state.answers[q.id] = inp.value;
      btn.disabled = !inp.value.trim();
    });
    const next = () => { if ((state.answers[q.id] || "").trim()) go("fwd"); };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); next(); } });
    btn.addEventListener("click", next);
  },
  money(q) {
    const inp = $("#f-" + q.id), btn = $("#go");
    inp.addEventListener("input", () => {
      state.answers[q.id] = digits(inp.value);
      inp.value = fmtMoney(inp.value);
      btn.disabled = !state.answers[q.id];
    });
    const next = () => { if (state.answers[q.id]) go("fwd"); };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); next(); } });
    btn.addEventListener("click", next);
  },
  address(q) {
    const k = q.id, btn = $("#go");
    const f = { Line: $("#a-line"), City: $("#a-city"), State: $("#a-state"), Zip: $("#a-zip") };
    const unit = $("#a-unit");
    const complete = () => !!(f.Line.value.trim() && f.City.value.trim() && f.State.value && /^\d{5}$/.test(f.Zip.value.trim()));
    const sync = () => {
      Object.keys(f).forEach(n => { state.answers[k + n] = f[n].value.trim(); });
      if (unit) state.answers[k + "Unit"] = unit.value.trim();
      btn.disabled = !complete();
    };
    Object.keys(f).forEach(n => f[n].addEventListener(n === "State" ? "change" : "input", () => {
      if (n === "Zip") f.Zip.value = f.Zip.value.replace(/\D/g, "").slice(0, 5);
      sync();
    }));
    if (unit) unit.addEventListener("input", sync);
    const add = $("#add-unit");
    if (add) add.addEventListener("click", () => { sync(); state.showUnit = true; renderQuestion(q, questions().length); setTimeout(() => { const u = $("#a-unit"); if (u) u.focus(); }, 0); });
    const next = () => {
      sync();
      if (!complete()) { const er = $("#addr-err"); er.textContent = "Enter the address, city, state, and five-digit ZIP code to continue."; er.hidden = false; return; }
      const a = state.answers;
      a[k] = [a[k + "Line"], a[k + "Unit"]].filter(Boolean).join(" ") + ", " + a[k + "City"] + ", " + a[k + "State"] + " " + a[k + "Zip"];
      go("fwd");
    };
    f.Zip.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); next(); } });
    btn.addEventListener("click", next);
    sync();
  },
  contact(q) {
    const form = $("#contact-form");
    const ids = { first: "contactFirstName", last: "contactLastName", email: "contactEmail" };
    ["first", "last", "email"].forEach(n => $("#c-" + n).addEventListener("input", e => {
      state.answers[ids[n]] = e.target.value;
      if (state.errors[n]) { delete state.errors[n]; e.target.classList.remove("invalid"); const s = e.target.parentNode.querySelector(".field-error"); if (s) s.remove(); }
    }));
    form.addEventListener("submit", e => {
      e.preventDefault();
      const a = state.answers, er = {};
      if (!(a.contactFirstName || "").trim()) er.first = "Please include a first name.";
      if (!(a.contactLastName || "").trim()) er.last = "Please include a last name.";
      if (!(a.contactEmail || "").trim()) er.email = "Please include an email address.";
      else if (!emailOk(a.contactEmail.trim())) er.email = "Please enter a valid email address.";
      if (Object.keys(er).length) { state.errors = er; renderQuestion(q, questions().length); const first = $(".invalid"); if (first) first.focus(); return; }
      a.contactFirstName = a.contactFirstName.trim(); a.contactLastName = a.contactLastName.trim(); a.contactEmail = a.contactEmail.trim();
      go("fwd");
    });
  },
  phone(q) {
    const inp = $("#c-phone"), btn = $("#go");
    inp.addEventListener("input", () => {
      state.answers.contactPhone = digits(inp.value).slice(0, 10);
      inp.value = fmtPhone(inp.value);
      if (state.errors.phone) { delete state.errors.phone; inp.classList.remove("invalid"); const s = inp.parentNode.querySelector(".field-error"); if (s) s.remove(); }
    });
    const submit = async () => {
      if (state.submitting) return;
      if (digits(state.answers.contactPhone).length !== 10) {
        state.errors.phone = "Enter a valid 10-digit phone number.";
        renderQuestion(q, questions().length); return;
      }
      state.submitting = true; state.submitError = "";
      renderQuestion(q, questions().length);
      const ok = await submitLead();
      state.submitting = false;
      if (ok) go("fwd"); else renderQuestion(q, questions().length);
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
    btn.addEventListener("click", submit);
  }
};

/* ==========================================================================
   SUBMIT
   ========================================================================== */
function buildPayload() {
  const qs = questions(), a = state.answers, summary = [], answers = {};
  qs.forEach(q => {
    if (q.kind === "contact" || q.kind === "phone") return;
    const val = a[q.id];
    if (val == null || val === "") return;
    answers[q.id] = val;
    summary.push({ question: q.title, answer: Array.isArray(val) ? val.join(", ") : val });
  });
  const params = new URLSearchParams(location.search), utm = {};
  ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content", "gclid", "fbclid"].forEach(k => { if (params.get(k)) utm[k] = params.get(k); });
  const phone = digits(a.contactPhone);
  return {
    flow: state.flow,
    flowLabel: FLOWS[state.flow].label,
    firstName: a.contactFirstName, lastName: a.contactLastName,
    email: a.contactEmail, phone: phone ? "+1" + phone : "",
    answers, summary,
    submittedAt: new Date().toISOString(),
    pageUrl: location.href, referrer: document.referrer || "", utm
  };
}
async function submitLead() {
  const payload = buildPayload();
  if (!CONFIG.SUBMIT_URL) {
    console.info("[funnel] Demo mode — set CONFIG.SUBMIT_URL to deliver leads. Payload:", payload);
    try { CONFIG.onSubmitted(payload); } catch (_) {}
    return true;
  }
  try {
    const res = await fetch(CONFIG.SUBMIT_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    try { CONFIG.onSubmitted(payload); } catch (_) {}
    return true;
  } catch (err) {
    console.error("[funnel] submit failed", err);
    state.submitError = "We couldn’t save your information. Please check your connection and try again.";
    return false;
  }
}

/* ==========================================================================
   DONE
   ========================================================================== */
function renderDone() {
  app.innerHTML =
    '<section class="done">' +
      '<div class="done-badge">' + icon("clipboard", 28, 1.8) + '<span class="pip">' + icon("check", 14, 3) + '</span></div>' +
      '<p class="eyebrow">Your next step is ready</p>' +
      '<h1 class="title" tabindex="-1">Let’s talk about your next move.</h1>' +
      '<p class="copy">You’ve given ' + esc(CONFIG.ADVISOR) + ' a helpful starting point. Schedule a no-pressure conversation to compare the options, costs, and tradeoffs that matter to you.</p>' +
      (CONFIG.BOOKING_URL ? '<a class="booking" href="' + esc(CONFIG.BOOKING_URL) + '" target="_blank" rel="noopener noreferrer">' + icon("calendar") + ' Schedule a conversation ' + icon("arrow") + '</a>' : '') +
      '<button class="text-link mt-4" id="restart">Start over</button>' +
    '</section>';
  $("#restart").addEventListener("click", reset);
  const h = $("h1.title"); if (h) h.focus({ preventScroll: true });
}

render();
</script>
